<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リバーシ</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0c2a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="リバーシ">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 盤がいちばんの主役。まわりは段（相手の強さ）ごとに雰囲気が変わる */
:root {
  --bg1: #154a35; --bg2: #081d15;
  --felt1: #23845a; --felt2: #155c3c;
  --frame1: #8a5a30; --frame2: #4a2a13; --frame3: #2a170a;
  --accent: #e0bb66;
  --glow: transparent;
  --text: #eef3ee;
  --muted: #a6c2b4;
  --sheet: rgba(6, 20, 14, .92);
  --line: rgba(255,255,255,.12);
  --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --bs: 360px;  /* 盤の大きさ（JSで画面に合わせて入れる） */
  color-scheme: dark;
}
/* 段ごとの雰囲気 */
body[data-tier="4"] { --bg1: #123526; --bg2: #040d09; --felt1: #1d7650; --felt2: #104a31; --frame1: #5a3519; --frame2: #2c170a; --frame3: #150a04; --accent: #d4b46e; }
body[data-tier="5"] { --bg1: #0c2a4a; --bg2: #02060f; --felt1: #1a6f5c; --felt2: #0d4239; --frame1: #2b4057; --frame2: #121d2a; --frame3: #070b12; --accent: #8fd6ff; --glow: #2f9dff; --muted: #9db8cc; }
body[data-tier="6"] { --bg1: #4a0b0d; --bg2: #080102; --felt1: #1b6146; --felt2: #0d3526; --frame1: #2a1212; --frame2: #120606; --frame3: #050202; --accent: #ff6b57; --glow: #ff2320; --muted: #c9a3a0; }
body[data-tier="7"] { --bg1: #5a4410; --bg2: #0b0803; --felt1: #208a59; --felt2: #105a39; --frame1: #f6dc85; --frame2: #b98c2b; --frame3: #5c410c; --accent: #ffe39a; --glow: #ffcf5a; --muted: #d6c79e; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 38%, var(--bg1) 0%, var(--bg2) 100%) fixed, var(--bg2);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  transition: background .6s;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* 背景の演出（竜王・鬼神・神） */
.fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.fx .rays {
  position: absolute; left: 50%; top: 40%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
  background: repeating-conic-gradient(from 0deg, rgba(255, 214, 110, .11) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0%, transparent 45%); mask: radial-gradient(circle, #000 0%, transparent 45%);
  animation: spin 90s linear infinite;
}
.fx .ember {
  position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
  background: #ff7a3c; box-shadow: 0 0 8px 2px rgba(255, 70, 30, .7);
  animation: rise linear infinite;
}
.fx .wisp {
  position: absolute; bottom: -20%; width: 40vmax; height: 60vmax; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(60, 160, 255, .22), transparent);
  filter: blur(10px);
  animation: wisp ease-in-out infinite alternate;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx, 20px), -110vh); opacity: 0; } }
@keyframes wisp { from { transform: translateY(0) scaleY(1); opacity: .6; } to { transform: translateY(-12%) scaleY(1.15); opacity: 1; } }

.screen { position: relative; z-index: 1; height: 100%; }

/* ---------- 相手選び（番付） ---------- */
.home {
  max-width: 520px; margin: 0 auto; height: 100%;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; flex-direction: column; gap: 12px;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: 1.6rem; letter-spacing: .12em; }
.brand .pair { display: flex; }
.brand .pair i { width: 20px; height: 20px; border-radius: 50%; display: block; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.brand .pair i:first-child { background: radial-gradient(circle at 35% 30%, #5b5b60, #101012 60%); }
.brand .pair i:last-child { margin-left: -6px; background: radial-gradient(circle at 35% 30%, #fff, #d9d4c6 70%); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); background: rgba(0,0,0,.28); flex-shrink: 0;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="false"] { opacity: .55; }

.ladder { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.rung {
  position: relative; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px;
  width: 100%; text-align: left; min-height: 62px; padding: 8px 14px 8px 12px;
  border-radius: 12px; border: 1px solid rgba(255,255,255,.08);
  background: linear-gradient(90deg, rgba(0,0,0,.34), rgba(0,0,0,.18));
}
.rung:active { transform: scale(.985); }
.rung .lv { font-family: var(--mincho); font-weight: 800; font-size: 1.05rem; color: var(--muted); text-align: center; }
.rung .nm { font-family: var(--mincho); font-weight: 800; font-size: 1.32rem; line-height: 1.15; letter-spacing: .06em; }
.rung .ds { display: block; font-size: .78rem; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.rung .rec { text-align: right; font-size: .78rem; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.rung .rec b { color: var(--text); font-weight: 700; }
.crown { width: 22px; height: 22px; color: #f2c94c; filter: drop-shadow(0 0 4px rgba(242, 201, 76, .5)); }
.rung[data-lv="5"] { border-color: rgba(80, 170, 255, .35); background: linear-gradient(90deg, rgba(10, 40, 80, .7), rgba(0,0,0,.2)); }
.rung[data-lv="5"] .nm { color: #bfe6ff; text-shadow: 0 0 12px rgba(60, 160, 255, .6); }
.rung[data-lv="6"] { border-color: rgba(255, 60, 50, .4); background: linear-gradient(90deg, rgba(70, 6, 8, .85), rgba(0,0,0,.25)); }
.rung[data-lv="6"] .nm { color: #ffb3a8; text-shadow: 0 0 12px rgba(255, 40, 30, .7); }
.rung[data-lv="7"] { min-height: 74px; border-color: rgba(255, 215, 110, .55); background: linear-gradient(100deg, rgba(110, 80, 15, .85), rgba(30, 20, 4, .7) 60%, rgba(0,0,0,.3)); }
.rung[data-lv="7"] .nm { font-size: 1.7rem; color: #ffe7a6; text-shadow: 0 0 16px rgba(255, 200, 80, .8); letter-spacing: .3em; }
.rung[data-lv="4"] .nm { color: #f1e2bd; }

.resume {
  border-radius: 14px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
  background: rgba(0,0,0,.35); display: grid; gap: 10px;
}
.resume p { margin: 0; font-size: .95rem; line-height: 1.5; }
.resume p b { font-family: var(--mincho); font-size: 1.1rem; }
.row { display: flex; gap: 8px; }
.btn {
  flex: 1; min-height: 46px; border-radius: 12px; padding: 0 14px; font-weight: 700;
  border: 1px solid var(--line); background: rgba(255,255,255,.07);
}
.btn.main { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff), color-mix(in srgb, var(--accent) 70%, #000)); color: #1b1406; border-color: transparent; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 0; font-size: .9rem; color: var(--muted); }
.switch { position: relative; width: 52px; height: 30px; border-radius: 99px; background: rgba(255,255,255,.18); flex-shrink: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: #2fae6b; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

/* ---------- 対局 ---------- */
.game {
  height: 100%; display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 6px calc(env(safe-area-inset-bottom, 0px) + 8px);
  gap: 8px;
}
.game .bar, .game .scores, .game .status { width: min(100%, var(--bs)); }
/* 縦向き：上に戻るボタン、残りの高さの真ん中に「石の数・盤・手番の案内」 */
.game:not(.land) .side { display: contents; }
.game:not(.land) .bar { order: 0; margin-bottom: auto; }
.game:not(.land) .scores { order: 1; }
.game:not(.land) .frame { order: 2; }
.game:not(.land) .status { order: 3; margin-bottom: auto; }
.opp { text-align: center; line-height: 1.1; }
.opp .t { font-size: .72rem; color: var(--muted); }
.opp .n { font-family: var(--mincho); font-weight: 800; font-size: 1.35rem; letter-spacing: .1em; color: var(--accent); text-shadow: 0 0 14px var(--glow); }
.side { width: min(100%, var(--bs)); display: flex; flex-direction: column; gap: 8px; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.score {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 52px; border-radius: 12px;
  background: rgba(0,0,0,.3); border: 1px solid transparent; transition: border-color .25s, box-shadow .25s;
}
.score.turn { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.score .chip { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.score .chip.b { background: radial-gradient(circle at 35% 30%, #5b5b60, #101012 60%); }
.score .chip.w { background: radial-gradient(circle at 35% 30%, #fff, #d9d4c6 70%); }
.score .who { font-size: .8rem; color: var(--muted); line-height: 1.2; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score .num { margin-left: auto; font-weight: 700; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.score:last-child { flex-direction: row-reverse; }
.score:last-child .num { margin-left: 0; margin-right: auto; }
.score:last-child .who { text-align: right; }
.status { min-height: 1.6em; text-align: center; font-size: .95rem; color: var(--text); }
.status.dim { color: var(--muted); }
.thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "・"; } 50% { content: "・・"; } 75% { content: "・・・"; } }

/* 盤 */
.frame {
  position: relative; width: var(--bs); height: var(--bs); flex-shrink: 0;
  padding: calc(var(--bs) * .032); border-radius: calc(var(--bs) * .035);
  background:
    repeating-linear-gradient(97deg, rgba(255,255,255,.05) 0 2px, transparent 2px 9px),
    linear-gradient(145deg, var(--frame1), var(--frame2) 55%, var(--frame3));
  box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.4), 0 0 calc(var(--bs) * .09) color-mix(in srgb, var(--glow) 55%, transparent);
}
body[data-tier="5"] .frame, body[data-tier="6"] .frame, body[data-tier="7"] .frame { animation: aura 3.2s ease-in-out infinite alternate; }
@keyframes aura {
  from { box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px rgba(0,0,0,.4), 0 0 calc(var(--bs) * .05) color-mix(in srgb, var(--glow) 45%, transparent); }
  to   { box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px rgba(0,0,0,.4), 0 0 calc(var(--bs) * .13) color-mix(in srgb, var(--glow) 75%, transparent); }
}
.board {
  position: relative; width: 100%; height: 100%; display: grid;
  grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.07), transparent 70%),
    linear-gradient(160deg, var(--felt1), var(--felt2));
  box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.55), inset 0 2px 8px rgba(0,0,0,.35);
  border-radius: 2px;
}
.cell { position: relative; border-right: 1px solid rgba(0,0,0,.42); border-bottom: 1px solid rgba(0,0,0,.42); display: grid; place-items: center; perspective: 300px; }
.cell:nth-child(8n) { border-right: 0; }
.cell:nth-child(n+57) { border-bottom: 0; }
.star { position: absolute; width: 1.4%; height: 1.4%; border-radius: 50%; background: rgba(0,0,0,.6); transform: translate(-50%, -50%); z-index: 1; }
.disc {
  width: 84%; height: 84%; border-radius: 50%; position: relative; z-index: 2;
  box-shadow: 0 calc(var(--bs) * .006) calc(var(--bs) * .008) rgba(0,0,0,.55);
}
.disc.b { background: radial-gradient(circle at 34% 28%, #66666b 0%, #1d1d20 42%, #050506 75%); }
.disc.w { background: radial-gradient(circle at 34% 28%, #ffffff 0%, #f1eee6 40%, #c9c3b4 85%); }
.disc.drop { animation: drop .22s cubic-bezier(.3, 1.4, .6, 1); }
.disc.flip { animation: flip .34s ease-in-out; }
@keyframes drop { from { transform: scale(1.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes flip { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(90deg) scale(1.12); } 100% { transform: rotateY(0) scale(1); } }
.last::after { content: ""; position: absolute; width: 18%; height: 18%; border-radius: 50%; background: #e2453b; z-index: 3; box-shadow: 0 0 4px rgba(0,0,0,.5); }
.hint::before { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%; background: rgba(0,0,0,.34); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.28); }
.cell.can { cursor: pointer; }
.ghost { position: absolute; width: 80%; height: 80%; border-radius: 50%; border: 3px solid #ffd76a; box-shadow: 0 0 10px rgba(255, 215, 106, .8); z-index: 4; }
.ghost::after { content: "AI"; position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--bs) * .028); font-weight: 700; color: #ffd76a; }

/* 横向きのとき：盤を左、情報を右 */
.game.land { flex-direction: row; justify-content: center; align-items: center; gap: 14px; padding-left: calc(env(safe-area-inset-left, 0px) + 8px); padding-right: calc(env(safe-area-inset-right, 0px) + 8px); }
.game.land .side { width: min(320px, 40vw); }
.game.land .side > * { width: 100%; }
.game.land .scores { grid-template-columns: 1fr; }
.game.land .score:last-child { flex-direction: row; }
.game.land .score:last-child .num { margin-left: auto; margin-right: 0; }
.game.land .score:last-child .who { text-align: left; }
.game .side .bar { width: 100%; }

/* ---------- 告知・結果 ---------- */
.toast {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; pointer-events: none;
  text-align: center; padding: 18px 28px; border-radius: 16px; background: rgba(0,0,0,.72);
  border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
  animation: pop 1.8s ease forwards;
}
.toast .big { font-family: var(--mincho); font-weight: 800; font-size: 1.5rem; letter-spacing: .08em; }
.toast .small { font-size: .9rem; color: var(--muted); margin-top: 4px; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -40%); } 12% { opacity: 1; transform: translate(-50%, -50%); } 80% { opacity: 1; } 100% { opacity: 0; } }
.intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,.8)); animation: introbg 2.6s ease forwards; }
.intro div { font-family: var(--mincho); font-weight: 800; font-size: min(36vw, 200px); line-height: 1; color: var(--accent); text-shadow: 0 0 30px var(--glow), 0 0 80px var(--glow); animation: introtx 2.6s ease forwards; }
@keyframes introbg { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes introtx { 0% { opacity: 0; transform: scale(1.4); filter: blur(10px); } 25% { opacity: 1; transform: scale(1); filter: blur(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(.96); } }

.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.55); }
.sheet {
  width: min(100%, 380px); border-radius: 18px; padding: 22px 18px 16px; text-align: center;
  background: var(--sheet); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  box-shadow: 0 20px 50px rgba(0,0,0,.6); display: grid; gap: 14px;
  animation: sheetin .28s cubic-bezier(.2, 1.2, .4, 1);
}
@keyframes sheetin { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.sheet h2 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: 2.6rem; letter-spacing: .2em; line-height: 1.1; }
.sheet h2.win { color: var(--accent); text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent); }
.sheet h2.lose { color: #c9ced3; }
.sheet .final { font-size: 1.15rem; font-variant-numeric: tabular-nums; display: flex; justify-content: center; align-items: center; gap: 10px; }
.sheet .final .chip { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.sheet .final .chip.b { background: radial-gradient(circle at 35% 30%, #5b5b60, #101012 60%); }
.sheet .final .chip.w { background: radial-gradient(circle at 35% 30%, #fff, #d9d4c6 70%); }
.sheet .note { margin: 0; font-size: .9rem; color: var(--muted); line-height: 1.5; }
.sheet .note.crowned { color: #f2c94c; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sheet .col { display: grid; gap: 8px; }
.sheet p.q { margin: 0; font-size: 1rem; line-height: 1.6; }

/* ---------- 振り返り ---------- */
.review {
  height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 6px calc(env(safe-area-inset-bottom, 0px) + 8px);
  overflow-y: auto;
}
.review .bar, .review .panel { width: min(100%, var(--bs)); }
.review .panel { display: flex; flex-direction: column; gap: 8px; }
.review.land { flex-direction: row; justify-content: center; align-items: center; gap: 14px; overflow: hidden; }
.review.land .panel { width: min(340px, 42vw); }
.review .bar .ttl { font-family: var(--mincho); font-weight: 800; font-size: 1.15rem; letter-spacing: .08em; }
.moveinfo { min-height: 3.2em; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,.3); font-size: .9rem; line-height: 1.55; }
.moveinfo .tag { display: inline-block; padding: 0 8px; border-radius: 6px; font-weight: 700; font-size: .82rem; margin-left: 6px; }
.tag.bad { background: #b3261e; color: #fff; }
.tag.dub { background: #c98a12; color: #1b1406; }
.tag.good { background: #2f7d55; color: #fff; }
.graph { position: relative; height: 120px; border-radius: 12px; background: rgba(0,0,0,.3); touch-action: none; }
.graph canvas { width: 100%; height: 100%; display: block; }
.graph .lbl { position: absolute; left: 8px; font-size: .7rem; color: var(--muted); pointer-events: none; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps .btn { min-height: 44px; font-size: .9rem; }
.progress { width: min(100%, var(--bs)); text-align: center; color: var(--muted); font-size: .9rem; padding: 6px; }

@media (prefers-reduced-motion: reduce) {
  .fx .rays, .fx .ember, .fx .wisp, .frame { animation: none !important; }
}
</style>
</head>
<body data-tier="1">
<div class="fx" id="fx" aria-hidden="true"></div>

<!-- 相手選び -->
<section class="screen" id="home">
  <div class="home">
    <div class="bar">
      <div class="brand"><span class="pair"><i></i><i></i></span><h1>リバーシ</h1></div>
      <button class="icon-btn sound-btn" aria-label="音" aria-pressed="true"></button>
    </div>

<!-- 対局 -->
<section class="screen" id="game" hidden>

        <div class="score" id="scB"><span class="chip b"></span><span class="who" id="whoB"></span><span class="num" id="numB">2</span></div>
        <div class="score" id="scW"><span class="chip w"></span><span class="who" id="whoW"></span><span class="num" id="numW">2</span></div>

<!-- 振り返り -->

  <div class="review" id="reviewBox">

        <button class="icon-btn" id="revBack" aria-label="戻る">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>

<div id="layer"></div>

<script src="engine.js"></script>
<script>
'use strict';
const E = self.Engine;
const $ = (s) => document.querySelector(s);

/* ---------- 段の一覧 ---------- */
const LV = [null,
  { name: 'ひよこ', ds: 'でたらめに打つ。始めたばかりの相手' },
  { name: '見習い', ds: 'いちばん多く返せる所に打つ欲ばり' },
  { name: '門番', ds: '角を狙い、角の隣は避ける' },
  { name: '達人', ds: '3手先まで読む' },
  { name: '竜王', ds: '5手先まで読み、残り12マスで読み切る' },
  { name: '鬼神', ds: '7手先まで読み、残り16マスで読み切る' },
  { name: '神', ds: 'いちばん深く読み、終盤は最後まで読み切る' },
];

/* ---------- 保存（この端末の中だけ） ---------- */
const K_SET = 'reversi.v1.settings', K_REC = 'reversi.v1.records', K_SAVE = 'reversi.v1.save';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const settings = Object.assign({ sound: true, hints: true }, store.get(K_SET, {}));
let records = store.get(K_REC, {});
function saveSettings() { store.set(K_SET, settings); }

/* ---------- 音（その場で作る効果音） ---------- */
let ac = null;
function audio() {
  if (!settings.sound) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function noiseBuf(a, sec) {
  const b = a.createBuffer(1, Math.floor(a.sampleRate * sec), a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function tone(a, freq, t, dur, type, vol, glideTo) {
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function click(a, t, f, q, vol, dur) {
  const s = a.createBufferSource(); s.buffer = noiseBuf(a, dur);
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(bp).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  place() { const a = audio(); if (!a) return; const t = a.currentTime; click(a, t, 2400, 1.2, 0.9, 0.05); tone(a, 170, t, 0.08, 'sine', 0.5, 90); },
  flip() { const a = audio(); if (!a) return; const t = a.currentTime; click(a, t, 3600 + Math.random() * 900, 3, 0.35, 0.03); },
  pass() { const a = audio(); if (!a) return; const t = a.currentTime; tone(a, 392, t, 0.18, 'triangle', 0.25); tone(a, 294, t + 0.16, 0.26, 'triangle', 0.25); },
  win() { const a = audio(); if (!a) return; const t = a.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(a, f, t + i * 0.12, i === 3 ? 0.7 : 0.22, 'triangle', 0.3)); tone(a, 1568, t + 0.48, 0.6, 'sine', 0.08); },
  lose() { const a = audio(); if (!a) return; const t = a.currentTime; [392, 349, 311, 262].forEach((f, i) => tone(a, f, t + i * 0.2, i === 3 ? 0.8 : 0.3, 'sine', 0.25)); },
  draw() { const a = audio(); if (!a) return; const t = a.currentTime; tone(a, 440, t, 0.25, 'triangle', 0.25); tone(a, 440, t + 0.28, 0.4, 'triangle', 0.25); },
  heavy(god) {
    const a = audio(); if (!a) return; const t = a.currentTime;
    tone(a, 55, t, 2.4, 'sine', 0.7, 41);
    const s = a.createBufferSource(); s.buffer = noiseBuf(a, 2.2);
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.8, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    s.connect(lp).connect(g).connect(a.destination); s.start(t);
    // 鐘のような倍音
    const parts = god ? [220, 553, 885, 1240, 1660] : [110, 277, 442];
    parts.forEach((f, i) => tone(a, f, t + 0.02, (god ? 3.2 : 2.2) - i * 0.3, 'sine', (god ? 0.16 : 0.2) / (i + 1)));
  },
};
const SPEAKER_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintSound() {
  document.querySelectorAll('.sound-btn').forEach(b => { b.innerHTML = settings.sound ? SPEAKER_ON : SPEAKER_OFF; b.setAttribute('aria-pressed', String(settings.sound)); });
}
document.querySelectorAll('.sound-btn').forEach(b => b.addEventListener('click', () => {
  settings.sound = !settings.sound; saveSettings(); paintSound(); if (settings.sound) SFX.place();
}));

/* ---------- 雰囲気 ---------- */
function setTier(lv) {
  document.body.dataset.tier = String(lv);
  const fx = $('#fx'); fx.innerHTML = '';
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (lv === 5) {
    for (let i = 0; i < 4; i++) {
      const w = document.createElement('span'); w.className = 'wisp';
      w.style.left = (i * 28 - 15) + '%'; w.style.animationDuration = (3 + i * 0.8) + 's'; fx.appendChild(w);
    }
  } else if (lv === 6) {
    for (let i = 0; i < 22; i++) {
      const e = document.createElement('span'); e.className = 'ember';
      e.style.left = (Math.random() * 100) + '%';
      e.style.animationDuration = (6 + Math.random() * 7) + 's';
      e.style.animationDelay = (-Math.random() * 12) + 's';
      e.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      const s = 2 + Math.random() * 3; e.style.width = e.style.height = s + 'px';
      fx.appendChild(e);
    }
  } else if (lv === 7) {
    const r = document.createElement('div'); r.className = 'rays'; fx.appendChild(r);
  }
}

/* ---------- 盤の部品 ---------- */
function buildBoard(el) {
  el.innerHTML = '';
  for (let i = 0; i < 64; i++) {
    const c = document.createElement('div'); c.className = 'cell'; c.dataset.i = i;
    const d = document.createElement('div'); d.className = 'disc'; d.hidden = true; c.appendChild(d);
    el.appendChild(c);
  }
  for (const [x, y] of [[25, 25], [75, 25], [25, 75], [75, 75]]) {
    const s = document.createElement('span'); s.className = 'star'; s.style.left = x + '%'; s.style.top = y + '%'; el.appendChild(s);
  }
}
const bit = (l, h, i) => i < 32 ? (l >>> i) & 1 : (h >>> (i - 32)) & 1;
function paintDiscs(el, bl, bh, wl, wh) {
  const cells = el.children;
  for (let i = 0; i < 64; i++) {
    const d = cells[i].firstChild;
    const col = bit(bl, bh, i) ? 'b' : bit(wl, wh, i) ? 'w' : '';
    d.hidden = !col; d.className = 'disc' + (col ? ' ' + col : '');
  }
}

/* ---------- 盤の大きさを画面に合わせる ---------- */
function fit() {
  const W = window.innerWidth, H = window.innerHeight;
  const land = W > H * 1.15;
  let bs;
  if (land) {
    bs = Math.min(H - 16 - safe('top') - safe('bottom'), W - Math.min(320, W * 0.4) - 40 - safe('left') - safe('right'));
  } else {
    // 盤以外（戻るボタンの列・石の数・案内）の高さと、すき間
    const parts = ['#gameSide .bar', '#gameSide .scores', '#status'].map(q => $(q).offsetHeight);
    const used = (parts[0] ? parts.reduce((a, b) => a + b, 0) : 150) + 8 * 3 + 14;
    bs = Math.min(W - 12, H - used - safe('top') - safe('bottom'));
  }
  bs = Math.max(240, Math.floor(bs));
  document.documentElement.style.setProperty('--bs', bs + 'px');
  $('#gameBox').classList.toggle('land', land);
  $('#reviewBox').classList.toggle('land', land);
  if (!$('#review').hidden) drawGraph();
}
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(probe);
function safe(side) { return parseFloat(getComputedStyle(probe)['padding' + side[0].toUpperCase() + side.slice(1)]) || 0; }
window.addEventListener('resize', () => requestAnimationFrame(fit));

/* ---------- AI（裏で考える作業員） ---------- */
let worker = null, reqId = 0;
const pending = new Map();
let progressCb = null;
try {
  worker = new Worker('engine.js');
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.cmd === 'progress') { if (progressCb) progressCb(m.done, m.total); return; }
    const p = pending.get(m.id); if (!p) return;
    pending.delete(m.id);
    p.resolve(m.cmd === 'think' ? m.info : m.result);
  };
  worker.onerror = () => {
    worker = null;
    for (const [id, p] of pending) { pending.delete(id); p.resolve(p.fallback()); }
  };
} catch (e) { worker = null; }
function ask(msg, fallback) {
  return new Promise(resolve => {
    if (!worker) { setTimeout(() => resolve(fallback()), 20); return; }
    const id = ++reqId; msg.id = id;
    pending.set(id, { resolve, fallback });
    worker.postMessage(msg);
  });
}
const thinkAI = (board, level) => ask({ cmd: 'think', board, level }, () => E.think(...board, level));
const analyzeAll = (positions) => ask({ cmd: 'analyze', positions }, () => positions.map(p => E.analyzePosition(...p)));

/* ---------- 対局 ---------- */
const S = E.START;
const G = { lv: 1, humanBlack: true, moves: [], bl: S.bl, bh: S.bh, wl: S.wl, wh: S.wh, black: true, busy: false, over: false, token: 0, last: -1 };
const boardEl = $('#board');
buildBoard(boardEl);

function sideBits(black) { return black ? [G.bl, G.bh, G.wl, G.wh] : [G.wl, G.wh, G.bl, G.bh]; }
function isHumanTurn() { return G.black === G.humanBlack; }
function counts() { return [E.pc(G.bl) + E.pc(G.bh), E.pc(G.wl) + E.pc(G.wh)]; }

function setStatus(text, cls) { const s = $('#status'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); }

function paintGame() {
  paintDiscs(boardEl, G.bl, G.bh, G.wl, G.wh);
  const cells = boardEl.children;
  const can = (!G.over && !G.busy && isHumanTurn()) ? E.movesOf(...sideBits(G.black)) : [];
  for (let i = 0; i < 64; i++) {
    const c = cells[i];
    const ok = can.includes(i);
    c.classList.toggle('can', ok);
    c.classList.toggle('hint', ok && settings.hints);
    c.classList.toggle('last', i === G.last);
  }
  const [nb, nw] = counts();
  $('#numB').textContent = nb; $('#numW').textContent = nw;
  $('#scB').classList.toggle('turn', !G.over && G.black);
  $('#scW').classList.toggle('turn', !G.over && !G.black);
}

function saveGame() {
  if (G.over) { store.del(K_SAVE); return; }
  store.set(K_SAVE, { lv: G.lv, humanBlack: G.humanBlack, moves: G.moves });
}

// 手の並びから盤面を作り直す（パスは自動で挟む）。positions[i] は i 手目を打つ直前（打つ側から見た盤）
function replay(moves) {
  let bl = S.bl, bh = S.bh, wl = S.wl, wh = S.wh, black = true;
  const positions = [], movers = [];
  for (const sq of moves) {
    let b = black ? [bl, bh, wl, wh] : [wl, wh, bl, bh];
    if (!E.movesOf(...b).includes(sq)) { black = !black; b = black ? [bl, bh, wl, wh] : [wl, wh, bl, bh]; }
    positions.push(b); movers.push(black);
    const [a, c, d, e] = E.applyMove(...b, sq);
    if (black) { bl = a; bh = c; wl = d; wh = e; } else { wl = a; wh = c; bl = d; bh = e; }
    black = !black;
  }
  return { bl, bh, wl, wh, black, positions, movers };
}

function showScreen(id) {
  for (const s of ['home', 'game', 'review']) $('#' + s).hidden = s !== id;
  requestAnimationFrame(fit);
}

function startGame(lv, saved) {
  G.token++;
  G.lv = lv; G.over = false; G.busy = false;
  if (saved) {
    G.humanBlack = saved.humanBlack; G.moves = saved.moves.slice();
    const r = replay(G.moves);
    G.bl = r.bl; G.bh = r.bh; G.wl = r.wl; G.wh = r.wh; G.black = r.black;
    G.last = G.moves.length ? G.moves[G.moves.length - 1] : -1;
  } else {
    G.humanBlack = Math.random() < 0.5; G.moves = [];
    G.bl = S.bl; G.bh = S.bh; G.wl = S.wl; G.wh = S.wh; G.black = true; G.last = -1;
  }
  setTier(lv);
  $('#oppLv').textContent = 'Lv' + lv;
  $('#oppName').textContent = LV[lv].name;
  $('#whoB').textContent = G.humanBlack ? 'あなた' : LV[lv].name;
  $('#whoW').textContent = G.humanBlack ? LV[lv].name : 'あなた';
  showScreen('game');
  paintGame();
  saveGame();
  const tk = G.token;
  let wait = 0;
  if (!saved) {
    if (lv >= 6) { showIntro(LV[lv].name); SFX.heavy(lv === 7); wait = 2400; }
    setTimeout(() => {
      if (tk !== G.token) return;
      toast(G.humanBlack ? 'あなたは黒' : 'あなたは白', G.humanBlack ? '先手です' : '後手です（相手から打ちます）');
    }, wait);
    wait += G.humanBlack ? 300 : 1500;
  }
  G.busy = true; paintGame();
  setStatus('');
  setTimeout(() => { if (tk === G.token) { G.busy = false; turnLoop(); } }, wait);
}

function turnLoop() {
  if (G.over) return;
  const tk = G.token;
  const mine = E.movesOf(...sideBits(G.black));
  if (!mine.length) {
    const other = E.movesOf(...sideBits(!G.black));
    if (!other.length) { gameOver(); return; }
    const human = isHumanTurn();
    SFX.pass();
    setStatus(human ? 'あなたは打てる場所がないのでパスです' : LV[G.lv].name + 'は打てる場所がないのでパスしました', 'dim');
    toast('パス', human ? 'あなたの番を飛ばします' : LV[G.lv].name + 'の番を飛ばします');
    G.busy = true; paintGame();
    setTimeout(() => { if (tk !== G.token) return; G.busy = false; G.black = !G.black; turnLoop(); }, 1700);
    return;
  }
  paintGame();
  if (isHumanTurn()) { setStatus('あなたの番です'); return; }
  aiTurn();
}

async function aiTurn() {
  const tk = G.token;
  G.busy = true; paintGame();
  const s = $('#status'); s.textContent = LV[G.lv].name + 'が考え中'; s.className = 'status dim thinking';
  const t0 = performance.now();
  const info = await thinkAI(sideBits(G.black), G.lv);
  if (tk !== G.token) return;
  const minWait = G.lv <= 3 ? 650 : 450;
  const rest = minWait - (performance.now() - t0);
  if (rest > 0) await new Promise(r => setTimeout(r, rest));
  if (tk !== G.token) return;
  playMove(info.move);
}

function playMove(sq) {
  const tk = G.token;
  const b = sideBits(G.black);
  const flips = E.flipsOf(sq, ...b);
  const [a, c, d, e] = E.applyMove(...b, sq);
  const color = G.black ? 'b' : 'w';
  if (G.black) { G.bl = a; G.bh = c; G.wl = d; G.wh = e; } else { G.wl = a; G.wh = c; G.bl = d; G.bh = e; }
  G.moves.push(sq); G.last = sq; G.busy = true;
  saveGame();

  // 置く → 近い石から順に返す
  const cells = boardEl.children;
  for (const c2 of cells) c2.classList.remove('hint', 'can', 'last');
  const pd = cells[sq].firstChild;
  pd.hidden = false; pd.className = 'disc ' + color + ' drop';
  cells[sq].classList.add('last');
  SFX.place();
  let maxT = 0;
  const r0 = sq >> 3, c0 = sq & 7;
  for (const f of flips) {
    const dist = Math.max(Math.abs((f >> 3) - r0), Math.abs((f & 7) - c0));
    const t = 110 + (dist - 1) * 70;
    maxT = Math.max(maxT, t);
    setTimeout(() => {
      if (tk !== G.token) return;
      const dd = cells[f].firstChild;
      dd.classList.remove('flip'); void dd.offsetWidth; dd.classList.add('flip');
      SFX.flip();
      setTimeout(() => { if (tk === G.token) { dd.classList.remove('b', 'w'); dd.classList.add(color); } }, 170);
    }, t);
  }
  const [nb, nw] = counts();
  setTimeout(() => {
    if (tk !== G.token) return;
    $('#numB').textContent = nb; $('#numW').textContent = nw;
  }, maxT + 170);
  setTimeout(() => {
    if (tk !== G.token) return;
    G.busy = false; G.black = !G.black;
    turnLoop();
  }, maxT + 360);
}

boardEl.addEventListener('click', (ev) => {
  const c = ev.target.closest('.cell'); if (!c) return;
  if (G.over || G.busy || !isHumanTurn()) return;
  const sq = +c.dataset.i;
  if (!E.movesOf(...sideBits(G.black)).includes(sq)) return;
  audio();
  playMove(sq);
});

function gameOver() {
  G.over = true; G.busy = false;
  const [nb, nw] = counts();
  const me = G.humanBlack ? nb : nw, op = G.humanBlack ? nw : nb;
  const res = me > op ? 'w' : me < op ? 'l' : 'd';
  const rec = records[G.lv] || { w: 0, l: 0, d: 0 };
  const firstCrown = res === 'w' && !rec.w;
  rec[res]++; records[G.lv] = rec; store.set(K_REC, records);
  store.del(K_SAVE);
  paintGame();
  setStatus('対局終了', 'dim');
  setTimeout(() => {
    if (res === 'w') SFX.win(); else if (res === 'l') SFX.lose(); else SFX.draw();
    showResult(res, nb, nw, firstCrown);
  }, 500);
}

/* ---------- 告知・結果 ---------- */
function toast(big, small) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = '<div class="big"></div><div class="small"></div>';
  t.querySelector('.big').textContent = big; t.querySelector('.small').textContent = small || '';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}
function showIntro(name) {
  const d = document.createElement('div'); d.className = 'intro';
  d.innerHTML = '<div></div>'; d.firstChild.textContent = name;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2700);
}
const CROWN = '<svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2" rx="1"/></svg>';
function openSheet(html) {
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  $('#layer').appendChild(w);
  return w;
}
function showResult(res, nb, nw, firstCrown) {
  const title = res === 'w' ? '勝ち' : res === 'l' ? '負け' : '引き分け';
  const w = openSheet(
    `<h2 class="${res === 'w' ? 'win' : res === 'l' ? 'lose' : ''}">${title}</h2>` +
    `<div class="final"><span class="chip b"></span>${nb}<span style="opacity:.5">対</span>${nw}<span class="chip w"></span></div>` +
    (firstCrown ? `<p class="note crowned">${CROWN}${LV[G.lv].name}にはじめて勝ちました</p>` : `<p class="note">${LV[G.lv].name}との成績　${recText(G.lv)}</p>`) +
    `<div class="col"><button class="btn main" data-a="review">振り返る</button>` +
    `<div class="row"><button class="btn" data-a="again">もう一度</button><button class="btn" data-a="home">相手を選ぶ</button></div></div>`);
  w.addEventListener('click', (ev) => {
    const a = ev.target.closest('[data-a]'); if (!a) return;
    w.remove();
    if (a.dataset.a === 'again') startGame(G.lv);
    else if (a.dataset.a === 'home') goHome();
    else openReview();
  });
}
function recText(lv) {
  const r = records[lv];
  if (!r || !(r.w + r.l + r.d)) return '未対戦';
  return `${r.w}勝 ${r.l}敗` + (r.d ? ` ${r.d}分` : '');
}

$('#quitBtn').addEventListener('click', () => {
  if (G.over) { goHome(); return; }
  if (!G.moves.length) { G.token++; store.del(K_SAVE); goHome(); return; }
  const w = openSheet('<p class="q">この対局をやめますか？<br>やめた対局は成績に数えません。</p><div class="row"><button class="btn" data-a="no">続ける</button><button class="btn main" data-a="yes">やめる</button></div>');
  w.addEventListener('click', (ev) => {
    const a = ev.target.closest('[data-a]'); if (!a) return;
    w.remove();
    if (a.dataset.a === 'yes') { G.token++; store.del(K_SAVE); goHome(); }
  });
});

/* ---------- 相手選び ---------- */
function goHome() {
  setTier(1);
  showScreen('home');
  renderHome();
}
function renderHome() {
  const lad = $('#ladder'); lad.innerHTML = '';
  for (let lv = 7; lv >= 1; lv--) {
    const r = records[lv];
    const b = document.createElement('button');
    b.className = 'rung'; b.dataset.lv = lv;
    b.innerHTML = `<span class="lv">${lv}</span><span><span class="nm"></span><span class="ds"></span></span><span class="rec">${r && r.w ? CROWN : ''}<span>${recHtml(lv)}</span></span>`;
    b.querySelector('.nm').textContent = LV[lv].name;
    b.querySelector('.ds').textContent = LV[lv].ds;
    b.setAttribute('aria-label', `Lv${lv} ${LV[lv].name}と対戦する。${recText(lv)}`);
    b.addEventListener('click', () => { audio(); store.del(K_SAVE); startGame(lv); });
    lad.appendChild(b);
  }
  const sv = store.get(K_SAVE, null);
  const box = $('#resume');
  if (sv && sv.moves && sv.moves.length && LV[sv.lv]) {
    box.hidden = false;
    $('#resumeText').innerHTML = `<b></b>との対局が途中です（${sv.moves.length}手まで進んでいます）`;
    $('#resumeText b').textContent = LV[sv.lv].name;
  } else box.hidden = true;
  const sw = $('#hintSwitch'); sw.setAttribute('aria-checked', String(settings.hints));
}
function recHtml(lv) {
  const r = records[lv];
  if (!r || !(r.w + r.l + r.d)) return '未対戦';
  return `<b>${r.w}</b>勝 <b>${r.l}</b>敗` + (r.d ? ` <b>${r.d}</b>分` : '');
}
$('#resumeGo').addEventListener('click', () => { audio(); const sv = store.get(K_SAVE, null); if (sv) startGame(sv.lv, sv); });
$('#resumeDrop').addEventListener('click', () => { store.del(K_SAVE); renderHome(); });
$('#hintSwitch').addEventListener('click', () => { settings.hints = !settings.hints; saveSettings(); renderHome(); });

/* ---------- 振り返り ---------- */
const revBoardEl = $('#revBoard');
buildBoard(revBoardEl);
const R = { moves: [], positions: [], movers: [], data: null, k: 0, vals: [], loss: [], humanBlack: true, lv: 1 };

async function openReview() {
  R.moves = G.moves.slice(); R.humanBlack = G.humanBlack; R.lv = G.lv;
  const rp = replay(R.moves);
  R.positions = rp.positions; R.movers = rp.movers;
  R.final = rp;
  R.k = R.moves.length;
  showScreen('review');
  $('#revTitle').textContent = LV[R.lv].name + 'との対局';
  $('#revPanel').hidden = true; $('#revProgress').hidden = false;
  $('#revProgress').textContent = '分析中…';
  paintReviewBoard();
  progressCb = (done, total) => { $('#revProgress').textContent = `分析中… ${done} / ${total}`; };
  const data = await analyzeAll(R.positions);
  progressCb = null;
  if ($('#review').hidden) return;
  R.data = data;
  // 黒から見た形勢（i 手目を打つ直前）。最後は実際の石差
  const vb = data.map((d, i) => R.movers[i] ? d.value : -d.value);
  const fb = E.pc(rp.bl) + E.pc(rp.bh) - E.pc(rp.wl) - E.pc(rp.wh);
  const fe = 64 - E.pc(rp.bl) - E.pc(rp.bh) - E.pc(rp.wl) - E.pc(rp.wh);
  vb.push(fb > 0 ? fb + fe : fb < 0 ? fb - fe : 0);
  R.vals = vb.map(v => R.humanBlack ? v : -v);  // あなたから見た形勢
  R.loss = R.moves.map((sq, i) => {
    const before = R.movers[i] ? vb[i] : -vb[i], after = R.movers[i] ? vb[i + 1] : -vb[i + 1];
    return sq === data[i].best ? 0 : Math.max(0, before - after);
  });
  $('#revProgress').hidden = true; $('#revPanel').hidden = false;
  requestAnimationFrame(() => { fit(); showStep(R.moves.length); });
}

function grade(i) {
  const l = R.loss[i];
  if (l >= 12) return ['悪手', 'bad'];
  if (l >= 6) return ['疑問手', 'dub'];
  if (R.data && R.moves[i] === R.data[i].best) return ['最善', 'good'];
  return null;
}
const COLS = 'abcdefgh';
const sqName = (sq) => COLS[sq & 7] + ((sq >> 3) + 1);

function paintReviewBoard() {
  const k = R.k;
  const r = replay(R.moves.slice(0, k));
  paintDiscs(revBoardEl, r.bl, r.bh, r.wl, r.wh);
  const cells = revBoardEl.children;
  for (let i = 0; i < 64; i++) { cells[i].classList.remove('last', 'hint', 'can'); const g = cells[i].querySelector('.ghost'); if (g) g.remove(); }
  if (k > 0) {
    cells[R.moves[k - 1]].classList.add('last');
    if (R.data) {
      const best = R.data[k - 1].best;
      if (best >= 0 && best !== R.moves[k - 1]) { const g = document.createElement('span'); g.className = 'ghost'; cells[best].appendChild(g); }
    }
  }
}

function showStep(k) {
  R.k = Math.max(0, Math.min(R.moves.length, k));
  paintReviewBoard();
  const info = $('#moveInfo');
  const fmt = (v) => (v > 0 ? '+' : '') + Math.round(v);
  if (R.k === 0) {
    info.textContent = '対局の始まり。グラフを触るか ▶ で1手ずつ進めます。';
  } else {
    const i = R.k - 1;
    const human = R.movers[i] === R.humanBlack;
    const who = human ? 'あなた' : LV[R.lv].name;
    const g = grade(i);
    info.innerHTML = '';
    const head = document.createElement('div');
    head.textContent = `${R.k}手目　${who}（${R.movers[i] ? '黒' : '白'}）が ${sqName(R.moves[i])}`;
    if (g) { const t = document.createElement('span'); t.className = 'tag ' + g[1]; t.textContent = g[0]; head.appendChild(t); }
    const body = document.createElement('div');
    body.style.color = 'var(--muted)';
    let s = `形勢 ${fmt(R.vals[i])} → ${fmt(R.vals[i + 1])}（＋はあなたが有利）`;
    const best = R.data[i].best;
    if (best >= 0 && best !== R.moves[i]) s += `。金の輪はAIのおすすめ（${sqName(best)}）`;
    body.textContent = s;
    info.append(head, body);
  }
  drawGraph();
}

function drawGraph() {
  const cv = $('#graphCv'); if (!cv || !R.vals.length) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  x.clearRect(0, 0, w, h);
  const n = R.vals.length - 1, pad = 10;
  const maxV = Math.max(16, ...R.vals.map(Math.abs));
  const X = (i) => pad + (w - pad * 2) * (n ? i / n : 0);
  const Y = (v) => h / 2 - (h / 2 - 14) * Math.max(-1, Math.min(1, v / maxV));
  x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(pad, h / 2); x.lineTo(w - pad, h / 2); x.stroke();
  // 面
  const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#e0bb66';
  x.beginPath(); x.moveTo(X(0), h / 2);
  R.vals.forEach((v, i) => x.lineTo(X(i), Y(v)));
  x.lineTo(X(n), h / 2); x.closePath();
  x.fillStyle = 'rgba(255,255,255,.08)'; x.fill();
  x.beginPath(); R.vals.forEach((v, i) => i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)));
  x.strokeStyle = accent; x.lineWidth = 2; x.lineJoin = 'round'; x.stroke();
  // あなたの悪手・疑問手
  R.moves.forEach((sq, i) => {
    if (R.movers[i] !== R.humanBlack) return;
    const g = grade(i); if (!g || g[1] === 'good') return;
    x.fillStyle = g[1] === 'bad' ? '#e5483d' : '#e0a12a';
    x.beginPath(); x.arc(X(i + 1), Y(R.vals[i + 1]), 4.5, 0, Math.PI * 2); x.fill();
  });
  // 今見ている手
  x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(X(R.k), 4); x.lineTo(X(R.k), h - 4); x.stroke();
}
function graphPick(ev) {
  const cv = $('#graphCv'); const rect = cv.getBoundingClientRect();
  const n = R.vals.length - 1; if (n < 1) return;
  const t = (ev.clientX - rect.left - 10) / (rect.width - 20);
  const k = Math.round(Math.max(0, Math.min(1, t)) * n);
  if (k !== R.k) showStep(k);
}
$('#graph').addEventListener('pointerdown', (ev) => { $('#graph').setPointerCapture(ev.pointerId); graphPick(ev); });
$('#graph').addEventListener('pointermove', (ev) => { if (ev.buttons) graphPick(ev); });
$('#stFirst').addEventListener('click', () => showStep(0));
$('#stPrev').addEventListener('click', () => showStep(R.k - 1));
$('#stNext').addEventListener('click', () => showStep(R.k + 1));
$('#stBad').addEventListener('click', () => {
  for (let j = 1; j <= R.moves.length; j++) {
    const k = (R.k + j - 1) % R.moves.length + 1, i = k - 1;
    const g = grade(i);
    if (R.movers[i] === R.humanBlack && g && g[1] !== 'good') { showStep(k); return; }
  }
  toast('悪手なし', 'あなたの手に大きなミスはありませんでした');
});
$('#revBack').addEventListener('click', () => {
  const w = openSheet('<p class="q">次はどうしますか？</p><div class="col"><button class="btn main" data-a="again">もう一度</button><button class="btn" data-a="home">相手を選ぶ</button></div>');
  w.addEventListener('click', (ev) => {
    const a = ev.target.closest('[data-a]'); if (!a) return;
    w.remove();
    if (a.dataset.a === 'again') startGame(R.lv); else goHome();
  });
});

/* ---------- 起動 ---------- */
paintSound();
goHome();
fit();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
// 検品用
window.__reversi = { G, R, E, startGame, playMove, replay };
</script>
